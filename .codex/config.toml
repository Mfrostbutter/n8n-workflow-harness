# GENERATED from .mcp.json by scripts/gen-agent-configs.mjs. Trusted projects only.

[mcp_servers.n8n_docs]
command = "node"
args = ["scripts/mcp-server.mjs"]
env = { "MCP_MODE" = "stdio", "LOG_LEVEL" = "error", "DISABLE_CONSOLE_OUTPUT" = "true", "N8N_MCP_TELEMETRY_DISABLED" = "true" }

[mcp_servers.n8n]
command = "node"
args = ["scripts/mcp-server.mjs"]
env = { "MCP_MODE" = "stdio", "LOG_LEVEL" = "error", "DISABLE_CONSOLE_OUTPUT" = "true", "N8N_MCP_TELEMETRY_DISABLED" = "true" }
env_vars = ["N8N_API_URL", "N8N_API_KEY", "N8N_CF_CLIENT_ID", "N8N_CF_CLIENT_SECRET"]

[mcp_servers.n8n_official]
# url references N8N_API_URL; Codex does not expand variables. Fill the literal URL:
# url = "${N8N_API_URL:-http://unset.invalid}/mcp-server/http"
