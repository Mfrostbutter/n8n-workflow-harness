# Workflow checks. Validation and lint run on every push and pull request with
# no instance access. Drift runs on a schedule against the dev instance and
# needs two repository secrets: N8N_API_URL_DEV and N8N_API_KEY_DEV.
# Using GitLab instead: delete this directory and keep .gitlab-ci.yml.
name: n8n checks

on:
  push:
    paths: ['workflows/**', 'scripts/**', 'tests/**', '.claude/**', '.github/**', 'setup.*', 'package*.json']
  pull_request:
    paths: ['workflows/**', 'scripts/**', 'tests/**', '.claude/**', '.github/**', 'setup.*', 'package*.json']
  schedule:
    - cron: '17 6 * * 1-5'
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # isolated-vm (via @n8n/expression-runtime) needs a prebuilt binary for the Node ABI or a C++
          # toolchain; the Windows runner has neither for every Node line. 24 has prebuilds.
          node-version: '24'
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - name: Generated configs and skills (copies on Windows)
        shell: bash
        run: |
          node scripts/gen-agent-configs.mjs
          node scripts/gen-agent-configs.mjs --check
          # The copies must never reach the index: every tracked entry stays a symlink, status stays clean.
          test -z "$(git status --porcelain -- .claude/skills)"
          test "$(git ls-files -s .claude/skills | grep -vc '^120000')" = 0
          git add -A --dry-run | grep -q 'skills/' && { echo 'skill copies would be added'; exit 1; } || true
      - name: Hooks run clean on this platform
        shell: bash
        run: |
          echo '{}' | node .claude/hooks/session-start.mjs | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8")).hookSpecificOutput.additionalContext || process.exit(1)'
          echo '{"tool_name":"mcp__n8n__n8n_create_workflow","tool_input":{}}' | node .claude/hooks/pre-n8n-write.mjs | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8")).hookSpecificOutput.additionalContext || process.exit(1)'
      - name: Offline preflight
        if: runner.os == 'Linux'
        run: ./scripts/verify-setup.sh --fast

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural validation
        run: |
          set -e
          found=0
          for f in workflows/*/*.json; do
            [ -e "$f" ] || continue
            found=1
            node scripts/validate.mjs "$f"
          done
          [ "$found" = 1 ] || echo "no workflow JSON yet"
      - name: Promotion lint
        run: |
          for d in workflows/*/; do
            ls "$d"*.json >/dev/null 2>&1 || continue
            node scripts/lint-workflow.mjs "$d" --require-tags --require-placement
          done
      - name: Semantic diff of changed workflows
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          for f in $(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- 'workflows/*/*.json'); do
            [ -e "$f" ] || { echo "removed: $f"; continue; }
            git show "origin/${{ github.base_ref }}:$f" > /tmp/base.json 2>/dev/null || { echo "new: $f"; continue; }
            echo "== $f"; node scripts/wf-diff.mjs /tmp/base.json "$f" || true
          done

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      N8N_API_URL_DEV: ${{ secrets.N8N_API_URL_DEV }}
      N8N_API_KEY_DEV: ${{ secrets.N8N_API_KEY_DEV }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repo versus dev instance
        run: node scripts/drift-check.mjs dev
