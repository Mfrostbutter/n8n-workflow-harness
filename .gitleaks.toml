# gitleaks config for this repo.
#
# This harness holds no secrets: credentials live in .env (gitignored) and in
# the n8n credential system. The allowlist below covers reviewed false
# positives only.
[extend]
useDefault = true

[[rules]]
  id = "generic-api-key"
  description = "Generic API key"
  regex = '''(?i)(?:key|api|token|secret|password)(?:[0-9a-z\-_\s.]{0,20})(?:=|>|:{1,3}=|\|\||:|<=|=>|:=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|<]|$)'''
  entropy = 3.5
  [rules.allowlist]
    # Example object-storage filenames in a vendored skill's documentation:
    # `imageKey = "sess12-abc123.png"` and a sample JSON return shape. Both are
    # illustrative filenames, not credentials. Verified 2026-08-25.
    paths = [
      '''\.claude/skills/n8n-binary-and-data/AGENT_TOOL_BINARY\.md''',
    ]

[allowlist]
  description = "Non-secret paths and placeholder values"
  paths = [
    '''\.env\.example''',
    '''package-lock\.json''',
  ]
  regexes = [
    # Documentation placeholders used throughout.
    '''your-api-key''',
    '''<the key>''',
    '''dummy-not-a-real-key''',
    '''example\.com''',
  ]
